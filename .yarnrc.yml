nodeLinker: node-modules

# Advisories already triaged in docs/DEPENDENCY-AUDIT-ELECTRON44.md
# ("Ignored advisories"). They are not fixed: each one is either in build-only
# tooling that never ships in the installer, or not reachable from the app.
# The weekly Security audit workflow fails on anything new.
npmAuditIgnoreAdvisories:
  # zod 3.x memory exhaustion on oversized arrays: the app validates single
  # settings values from its own window, never arrays (fix needs zod 4).
  - "1243066"
  # Build-only: tailwindcss / postcss / sucrase / chokidar chain.
  - "1123896" # brace-expansion
  - "1123897" # brace-expansion
  - "1130588" # brace-expansion
  - "1130589" # brace-expansion
  - "1130736" # brace-expansion
  - "1130737" # brace-expansion
  - "1240104" # brace-expansion
  - "1240105" # brace-expansion
  - "1240108" # brace-expansion
  - "1240109" # brace-expansion
  - "1098094" # braces
  - "1113459" # minimatch
  - "1113465" # minimatch
  - "1113538" # minimatch
  - "1113544" # minimatch
  - "1113546" # minimatch
  - "1113552" # minimatch
  - "1115552" # picomatch
  - "1124252" # postcss
  - "1139510" # postcss
