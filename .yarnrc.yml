nodeLinker: node-modules

# Advisories already triaged in docs/DEPENDENCY-AUDIT-ELECTRON44.md
# ("Ignored advisories"). They are not fixed: each one is in build-only
# tooling that never ships in the installer.
# The weekly Security audit workflow fails on anything new.
npmAuditIgnoreAdvisories:
  # Build-only: tailwindcss / postcss / sucrase / chokidar chain.
  - "1098094" # braces
  - "1113459" # minimatch
  - "1113465" # minimatch
  - "1113538" # minimatch
  - "1113544" # minimatch
  - "1113546" # minimatch
  - "1113552" # minimatch
  - "1115552" # picomatch
  - "1124252" # postcss
  - "1139510" # postcss
  # Build-only: node-gyp / cacache / make-fetch-happen chain (native rebuilds).
  - "1104664" # cross-spawn
  - "1109842" # glob CLI
  - "1130722" # ip-address
