name: Refresh critical transitive dependencies

on:
  push:
    branches:
      - security/refresh-transitive-deps

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install existing lockfile
        run: yarn install --immutable
      - name: Upgrade vulnerable transitive packages within existing semver constraints
        run: yarn up -R seroval proxy-addr form-data tar
      - name: Check upgraded lockfile can be installed
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: Audit remaining critical advisories (informational)
        continue-on-error: true
        run: yarn npm audit --all --recursive --severity critical
      - name: Commit updated lockfile to this review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh vulnerable transitive dependency resolutions"
            git push origin HEAD:security/refresh-transitive-deps
          fi
