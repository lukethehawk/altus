name: Stability checks

on:
  pull_request:
  push:
    branches:
      - hardening/stability-security-first

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: Dependency vulnerability audit (informational)
        run: yarn npm audit --all --recursive --severity high
        continue-on-error: true
      - name: Test IPC security helpers
        run: yarn test

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build Windows installer
        run: yarn make -p win32
      - name: Smoke test (app, installer, migration, uninstall)
        run: yarn smoke --installer
      - name: Enter keys (new line, Ctrl+Enter, Right Shift+Enter)
        if: ${{ !cancelled() }}
        run: yarn test:keys
      - name: Smoke test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
