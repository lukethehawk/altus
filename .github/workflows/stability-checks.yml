name: Stability checks

on:
  pull_request:
  push:
    branches:
      - hardening/stability-security-first

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: Dependency vulnerability audit (informational)
        run: yarn npm audit --all --recursive --severity high
        continue-on-error: true
      - name: Test IPC security helpers
        run: yarn test
