name: Altus + Windows installer

on:
  push:
    branches:
      - master
      - release/altus-plus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install pinned dependencies
        run: yarn install --immutable
      - name: Typecheck and lint
        run: yarn lint
      - name: IPC security tests
        run: yarn test
      - name: Package Windows installer
        run: yarn make -p win32
      - name: Downloadable Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Altus-Plus-Windows
          path: out/make/**/*.exe
          if-no-files-found: error
          retention-days: 90
